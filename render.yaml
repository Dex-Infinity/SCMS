services:
  - type: web
    name: scms-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./src/SCMS.API/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: scms-uploads
      mountPath: /var/scms/uploads
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: scms-db
          property: connectionString
      - key: SCMS_JWT_KEY
        generateValue: true
      - key: SCMS_UPLOAD_PATH
        value: /var/scms/uploads
      - key: Seed__SeedOnStartup
        value: "false"
      - key: SCMS_ADMIN_EMAIL
        sync: false
      - key: SCMS_ADMIN_PASSWORD
        sync: false
      - key: SCMS_ADMIN_USERNAME
        sync: false
      - key: SCMS_ADMIN_FULLNAME
        sync: false

  - type: web
    name: scms-web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./src/SCMS.Web/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ApiSettings__BaseUrl
        fromService:
          type: web
          name: scms-api
          property: url

databases:
  - name: scms-db
    plan: basic-256mb
    region: oregon
    databaseName: scms
    user: scms
