services:
  postgres:
    image: postgres:17-alpine
    container_name: scms-postgres
    environment:
      POSTGRES_DB: SCMSDb
      POSTGRES_USER: scms
      POSTGRES_PASSWORD: "${SCMS_DB_PASSWORD:-scms_local_only_change_me}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  sqlserver:
    profiles: ["legacy-sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: scms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SCMS@SqlServer2026!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S", "localhost",
          "-U", "sa",
          "-P", "SCMS@SqlServer2026!",
          "-C",
          "-Q", "SELECT 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/SCMS.API/Dockerfile
    container_name: scms-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      DATABASE_URL: "postgresql://scms:${SCMS_DB_PASSWORD:-scms_local_only_change_me}@postgres:5432/SCMSDb?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: src/SCMS.Web/Dockerfile
    container_name: scms-web
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ApiSettings__BaseUrl: "${SCMS_API_BASE_URL:-http://api:8080}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: scms_postgres_data
  sqlserver_data:
